<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI tutor notebook: launch film</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Caveat:wght@700&family=JetBrains+Mono:wght@500;700&family=Kalam:wght@400&display=block" rel="stylesheet">
<style>
:root{
  --blue:#2532d6;      /* ballpoint blue */
  --blue-hi:#4d5bff;
  --ink:#0c0e36;       /* bottled ink */
  --pen:#1a1d52;       /* the student's pen */
  --paper:#f3f5f9;
  --gridc:#cdd8ea;
  --red:#f23a2e;       /* the tutor's pencil */
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#05061a;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;overflow:hidden;transform-origin:0 0;background:var(--ink);
  font-family:"Archivo",system-ui,sans-serif;color:var(--paper);user-select:none;-webkit-user-select:none;cursor:pointer}
.scene{position:absolute;inset:0;overflow:hidden}
.fx{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.fx path,.mk path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.gridbg{background-color:var(--paper);
  background-image:linear-gradient(var(--gridc) 2px,transparent 2px),linear-gradient(90deg,var(--gridc) 2px,transparent 2px);
  background-size:60px 60px;background-position:-1px -1px}

/* headline blocks: lines rise out of a mask */
.hd{position:absolute;font-weight:800;line-height:1;letter-spacing:-.035em;white-space:nowrap;font-stretch:96%}
.ln{display:block;overflow:hidden;padding:.05em .06em .17em 0;margin-bottom:-.2em}
.in{display:inline-block;will-change:transform}

/* handwriting */
.hand{position:absolute;white-space:nowrap;line-height:1}
.st{font-family:"Kalam",cursive;color:var(--pen)}
.tu{font-family:"Caveat",cursive;font-weight:700;color:var(--red)}
.g{display:inline-block}
.sp{width:.3em}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-weight:500}

/* ---------- S1 cold open ---------- */
#s1{z-index:1}
#s1 .hd{color:var(--ink)}
.acard{position:absolute;width:430px;padding:26px 30px 30px;background:#fff;border-radius:30px 30px 30px 8px;color:var(--ink);
  box-shadow:0 30px 60px -18px rgba(22,30,120,.38),0 2px 0 rgba(22,30,120,.06);transform-origin:50% 100%}
.acard small{display:flex;align-items:center;gap:12px;font-size:25px;font-weight:600;color:#7b84a8;margin-bottom:12px}
.acard small i{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#9aa4ff,#2532d6)}
.acard b{display:block;font-size:56px;font-weight:800;letter-spacing:-.03em;white-space:nowrap}
.acard u{display:block;height:14px;border-radius:7px;background:#e2e7f3;margin-top:14px}

/* ---------- S2 red ---------- */
#s2{z-index:2;background:var(--red)}
#s2 .hd{color:#fff}

/* ---------- S3 device ---------- */
#s3{z-index:1;background:radial-gradient(120% 90% at 50% 55%,var(--blue-hi) 0%,var(--blue) 42%,#141c94 100%)}
#floor{position:absolute;border-radius:50%;background:rgba(6,9,70,.55);filter:blur(60px)}
#cam{position:absolute;inset:0;perspective:2600px}
#tab{position:absolute;left:0;top:0;transform-origin:0 0;border-radius:64px;background:#0a0b1c;
  box-shadow:0 0 0 3px #2a2c48 inset,0 0 0 2px #3b3e63,0 90px 120px -30px rgba(3,5,50,.7),0 30px 40px -10px rgba(3,5,50,.5)}
#screen{position:absolute;inset:28px;border-radius:38px;overflow:hidden;background:var(--paper)}
#bar{position:absolute;left:0;top:0;right:0;height:84px;background:#fff;border-bottom:2px solid #dfe5f1;display:flex;align-items:center;padding:0 22px;gap:12px;color:var(--ink)}
.tool{width:50px;height:50px;border-radius:14px;display:grid;place-items:center;background:#eef1f8}
.tool.on{background:var(--ink)}
.tool svg{width:28px;height:28px}
#doc{font-size:25px;font-weight:700;margin-left:10px;letter-spacing:-.01em;white-space:nowrap}
#chip{margin-left:auto;height:46px;padding:0 18px 0 14px;border-radius:23px;display:flex;align-items:center;gap:10px;font-size:22px;font-weight:600;background:#eef1f8;white-space:nowrap}
#chip i{width:14px;height:14px;border-radius:50%;background:var(--blue)}
#help{height:50px;padding:0 22px;border-radius:25px;background:var(--red);color:#fff;font-size:24px;font-weight:700;display:flex;align-items:center}
#page{position:absolute;left:0;top:84px;right:0;bottom:0}
#page.gridbg{background-size:46px 46px}
#scan{position:absolute;top:0;bottom:0;width:190px;background:linear-gradient(90deg,transparent,rgba(37,50,214,.22) 70%,rgba(37,50,214,.5) 98%,transparent)}
.tag{position:absolute;height:34px;padding:0 12px;border-radius:8px 8px 8px 0;background:var(--blue);color:#fff;font-size:19px;display:flex;align-items:center;white-space:nowrap}
#pen{position:absolute;left:0;top:0;width:0;height:0;filter:drop-shadow(14px 22px 12px rgba(10,14,80,.32))}
#pen svg{position:absolute;left:0;top:-20px;overflow:visible}
.cap{color:#fff}
.call{position:absolute;height:86px;padding:0 34px 0 28px;border-radius:43px;background:var(--ink);color:#fff;font-size:40px;font-weight:700;letter-spacing:-.02em;
  display:flex;align-items:center;gap:18px;white-space:nowrap;box-shadow:0 24px 44px -14px rgba(8,10,60,.55)}
.call i{width:20px;height:20px;border-radius:50%;background:var(--red);flex:none}

/* ---------- S5 how it works ---------- */
#s5{z-index:0}
#s5 .hd{color:var(--ink)}
.stn{position:absolute;color:var(--ink)}
.stn .num{position:absolute;left:-36px;top:-36px;width:72px;height:72px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:36px;font-weight:800}
.stn .lab{position:absolute;font-weight:800;letter-spacing:-.025em;line-height:1.04}
.stn .viz{position:absolute;white-space:nowrap}
.stn .viz .st{margin-top:14px}
.stn .codechip{margin-top:26px}
.stn .tile{margin-top:30px}
.codechip{display:inline-block;background:var(--ink);color:#e9ecff;border-radius:14px;padding:16px 22px;white-space:pre}
.codechip em{font-style:normal;color:#ff6a5e;font-weight:700}
.tile{position:relative;background:#fff;border-radius:16px;box-shadow:0 18px 36px -14px rgba(22,30,120,.35),0 0 0 2px #dfe5f1}

/* ---------- S6 structured reply ---------- */
#s6{z-index:2;background:var(--ink)}
#s6 .hd{color:#fff;font-weight:700}
#code{position:absolute;border-radius:28px;background:#14174a;box-shadow:0 0 0 2px #2a2f78 inset,0 50px 80px -30px #000;padding:34px 0;font-size:31px;line-height:1.62;color:#aeb6ee}
#code div{padding:0 38px;white-space:pre;position:relative}
#code .k{color:#8fa0ff}#code .s{color:#fff}#code .n{color:#ffb0a8}
#code .hl{position:absolute;left:0;right:0;top:0;bottom:0;background:var(--red);opacity:0}
#code span{position:relative}
#jpage{position:absolute;width:640px;height:400px;border-radius:22px;overflow:hidden;box-shadow:0 50px 80px -24px #000}
#jpage.gridbg{background-size:40px 40px}

/* ---------- montage ---------- */
#mont{z-index:3;background:var(--ink)}
.pan{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden}
.pan .hd{font-weight:800}
.vis{position:absolute;width:860px;height:860px}
#pA{background:var(--red);color:#fff}
#pB{color:var(--ink)}
#pC{background:var(--blue);color:#fff}
#pD{background:var(--ink);color:#fff}
.slip{position:absolute;width:740px;height:196px;background:#fff;border-radius:20px;color:var(--ink);box-shadow:0 30px 50px -20px rgba(90,0,0,.55)}
.slip b{position:absolute;left:34px;top:34px;font-size:120px;font-weight:900;line-height:1;letter-spacing:-.04em}
.slip span{position:absolute;left:150px;top:36px;font-size:36px;font-weight:700;letter-spacing:-.01em}
.slip em{position:absolute;left:150px;top:88px;font:700 60px/1 "Caveat",cursive;color:var(--red);white-space:nowrap}
#helpbig{position:absolute;left:0;top:0;height:104px;padding:0 44px;border-radius:52px;background:#fff;color:var(--red);font-size:50px;font-weight:800;display:flex;align-items:center;gap:22px;box-shadow:0 20px 40px -16px rgba(90,0,0,.55)}
#helpbig i{width:22px;height:22px;border-radius:50%;border:4px solid var(--red)}
#ripple{position:absolute;left:-10px;top:-10px;width:124px;height:124px;border-radius:62px;border:5px solid #fff}
#sheet{position:absolute;left:120px;top:20px;width:620px;height:820px;background:#fff;color:#1c1c28;border-radius:6px;padding:56px 54px;font-family:Georgia,"Times New Roman",serif;box-shadow:0 60px 80px -30px rgba(3,5,60,.75);transform-origin:50% 50%}
#sheet h4{font-size:36px;font-weight:700;margin-bottom:8px}
#sheet p{font-size:25px;color:#666a7c;margin-bottom:38px;border-bottom:2px solid #1c1c28;padding-bottom:20px}
#sheet li{list-style:none;font-size:34px;margin-bottom:92px;position:relative}
#sheet li s{position:absolute;left:150px;top:92px;width:330px;border-bottom:2px solid #9a9db0;text-decoration:none}
#sheet li q{position:absolute;left:38px;top:60px;quotes:none;font-style:italic}
#pdfchip{position:absolute;left:560px;top:-20px;width:180px;height:92px;border-radius:18px;background:#fff;color:var(--red);font:900 44px/92px "Archivo";text-align:center;letter-spacing:.02em;box-shadow:0 24px 40px -14px rgba(3,5,60,.7)}
#ptile{position:absolute;left:30px;top:70px;width:800px;height:330px;border-radius:22px;overflow:hidden}
#ptile.gridbg{background-size:44px 44px}
#mic{position:absolute;left:30px;top:480px;width:800px;height:150px;border-radius:75px;background:#1b1f63;display:flex;align-items:center;padding:0 30px;gap:9px}
#mic .mi{width:92px;height:92px;border-radius:50%;background:var(--red);display:grid;place-items:center;margin-right:20px;flex:none}
#mic b{display:block;width:10px;border-radius:5px;background:#fff;flex:none}
#said{position:absolute;left:36px;top:690px;font-size:66px;font-weight:700;letter-spacing:-.03em;white-space:nowrap}

/* ---------- the line ---------- */
#sl{z-index:4}
#sl .hd{color:var(--ink)}
#old{position:absolute;font-weight:600;color:#6a7299;letter-spacing:-.02em;white-space:nowrap}

/* ---------- end card ---------- */
#se{z-index:5;background:radial-gradient(110% 80% at 20% 30%,#1b2080 0%,var(--ink) 60%)}
.ghost{position:absolute;font-family:"Kalam",cursive;color:#fff;opacity:.075;white-space:nowrap;line-height:1}
#wm{color:#fff;font-stretch:110%;font-weight:800}
#tagl{position:absolute;font-weight:600;letter-spacing:-.02em;color:#aab3f5;white-space:nowrap}
#rule{position:absolute;height:3px;background:#fff;opacity:.9;transform-origin:0 50%}
.cred{position:absolute;white-space:nowrap;letter-spacing:-.01em}
#mark{position:absolute;width:190px;height:150px}
#mark div{position:absolute;left:0;top:0;width:190px;height:150px;font:400 86px/150px "Kalam",cursive;color:#fff;text-align:center}

/* light + grain over everything */
#light{position:absolute;inset:0;z-index:20;pointer-events:none;
  background:radial-gradient(90% 70% at 25% 12%,rgba(255,255,255,.10),transparent 60%),radial-gradient(120% 120% at 50% 50%,transparent 62%,rgba(4,5,40,.22) 100%)}
#grain{position:absolute;inset:0;z-index:21;pointer-events:none;opacity:.3}
</style>
</head>
<body>
<div id="stage"></div>
<script>
// ---- The one line to change when the project has a name ----
const PROJECT_NAME = "[need: name]";
// Shown on the end card while PROJECT_NAME is still the placeholder.
const NAME_FALLBACK = "AI tutor notebook";

// ?format=tall (1080x1920, default) | ?format=wide (1920x1080)
// ?t=12.5 jumps to that second and pauses. R or click restarts. Space pauses. Arrow keys step one frame.
const Q = new URLSearchParams(location.search);
const tall = Q.get("format") !== "wide";
const W = tall ? 1080 : 1920, H = tall ? 1920 : 1080;
const FPS = 30, DURATION = 34.5;
const placeholder = !PROJECT_NAME.trim() || /^\s*\[need/i.test(PROJECT_NAME);

// ---------- helpers ----------
const $ = (s) => document.querySelector(s), $$ = (s) => [...document.querySelectorAll(s)];
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const pr = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
const E = {
  lin: (x) => x,
  o3: (x) => 1 - (1 - x) ** 3, o5: (x) => 1 - (1 - x) ** 5,
  i3: (x) => x ** 3,
  io3: (x) => x < .5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2,
  io5: (x) => x < .5 ? 16 * x ** 5 : 1 - (-2 * x + 2) ** 5 / 2,
  back: (x) => 1 + 2.70158 * (x - 1) ** 3 + 1.70158 * (x - 1) ** 2,
};
const px = (n) => n.toFixed(2) + "px";
const hdHTML = (lines) => lines.map((l) => `<span class="ln"><span class="in">${l}</span></span>`).join("");
// masked line reveal; optional exit time
function rev(el, t, t0, o = {}) {
  const st = o.st ?? .09, d = o.d ?? .55;
  el._in.forEach((n, i) => {
    const a = (o.at ? o.at[i] : t0 + i * st);
    let y = (1 - E.o5(pr(t, a, a + d))) * 112;
    if (o.out != null) y -= E.i3(pr(t, o.out + i * .04, o.out + .3 + i * .04)) * 112;
    n.style.transform = `translateY(${y.toFixed(2)}%)`;
  });
}
function fitHd(el, maxW) {
  const w = Math.max(...el._in.map((n) => n.offsetWidth));
  if (w > maxW) el.style.fontSize = (parseFloat(getComputedStyle(el).fontSize) * maxW / w) + "px";
}
function mkHand(el, str) {
  el.innerHTML = [...str].map((c) => c === " " ? '<span class="g sp"></span>' : `<span class="g">${c}</span>`).join("");
  el._g = [...el.children]; return el;
}
// write glyphs left to right; returns pen position in the line's offsetParent coordinates
function write(el, t, t0, t1) {
  const g = el._g, n = g.length, q = pr(t, t0, t1) * n;
  g.forEach((s, i) => {
    const k = clamp(q - i);
    s.style.opacity = k > 0 ? 1 : 0;
    s.style.clipPath = k >= 1 || k <= 0 ? "none" : `inset(-30% ${((1 - k) * 100).toFixed(1)}% -30% -25%)`;
  });
  const i = Math.min(n - 1, Math.floor(q)), k = clamp(q - i), s = g[i];
  return { x: el.offsetLeft + s.offsetLeft + s.offsetWidth * k, y: el.offsetTop + el.offsetHeight * (.62 + .1 * Math.sin(q * 4.2)) };
}
function termBox(el, a, b) {
  const g = el._g, x0 = el.offsetLeft + g[a].offsetLeft, x1 = el.offsetLeft + g[b].offsetLeft + g[b].offsetWidth;
  return { cx: (x0 + x1) / 2, cy: el.offsetTop + el.offsetHeight * .5, rx: (x1 - x0) / 2, ry: el.offsetHeight * .5 };
}
function handEllipse(cx, cy, rx, ry, turns = 1.1, rot = -.1, a0 = -2.4) {
  let d = ""; const N = 96;
  for (let i = 0; i <= N; i++) {
    const a = a0 + Math.PI * 2 * turns * i / N, f = .95 + .05 * Math.sin(2 * a + 1) + .1 * i / N;
    const ex = rx * f * Math.cos(a), ey = ry * f * Math.sin(a);
    d += `${i ? "L" : "M"}${(cx + ex * Math.cos(rot) - ey * Math.sin(rot)).toFixed(1)} ${(cy + ex * Math.sin(rot) + ey * Math.cos(rot)).toFixed(1)}`;
  }
  return d;
}
const P = (id, stroke, w, extra = "") => `<path id="${id}" pathLength="1" stroke-dasharray="1 1" stroke="${stroke}" stroke-width="${w}" ${extra}/>`;
function draw(p, k) { p.style.strokeDashoffset = 1 - k; p.style.visibility = k <= 0 ? "hidden" : "visible"; }
function kf(t, K) {
  if (t <= K[0].t) return K[0];
  for (let i = 1; i < K.length; i++) if (t <= K[i].t) {
    const a = K[i - 1], b = K[i], k = (b.e || E.lin)(pr(t, a.t, b.t)), o = {};
    for (const key in b) if (key !== "t" && key !== "e") o[key] = lerp(a[key], b[key], k);
    return o;
  }
  return K[K.length - 1];
}
const show = (el, on) => { el.style.display = on ? "" : "none"; return on; };

// ---------- timeline (seconds; cuts sit on a 120 bpm grid = every 0.5 s) ----------
const T = { s2: 4, s3: 5.5, s5: 14.5, s6: 19, m: 21.5, grid: 26.5, line: 27.5, end: 31 };
const MP = [21.5, 22.75, 24, 25.25]; // montage panel starts

// ---------- build DOM ----------
const stage = $("#stage");
stage.style.width = W + "px"; stage.style.height = H + "px";
const ML = tall ? 80 : 110; // left margin for type

const cards = [
  ["AI answer", "f'(x) = 6x + 2"], ["AI answer", "x = 4"], ["Here's the full solution", null], ["AI answer", "= x³ + C"], ["AI answer", "Answer: 42"],
];
const cardPos = tall
  ? [[70, 1060, -6, 1], [600, 1010, 5, .82], [470, 1300, -3, 1.04], [50, 1500, 4, .9], [560, 1640, -7, .95]]
  : [[100, 640, -5, 1], [590, 600, 4, .85], [990, 690, -3, 1.05], [1420, 610, 5, .9], [480, 880, -6, .92]];

const TW = tall ? 880 : 1200, TH = tall ? 1200 : 860, BZ = 28, BAR = 84;
const HF = tall ? 92 : 96; // handwriting size on the tablet
const icon = {
  pen: '<svg viewBox="0 0 28 28"><path d="M5 23l3-9L19 3l6 6-11 11z" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/></svg>',
  era: '<svg viewBox="0 0 28 28"><rect x="5" y="9" width="18" height="11" rx="3" transform="rotate(-35 14 14)" fill="none" stroke="#0c0e36" stroke-width="2.6"/></svg>',
  las: '<svg viewBox="0 0 28 28"><ellipse cx="14" cy="12" rx="10" ry="7" fill="none" stroke="#0c0e36" stroke-width="2.6" stroke-dasharray="4 3"/><path d="M9 18v6" stroke="#0c0e36" stroke-width="2.6"/></svg>',
  mic: '<svg viewBox="0 0 28 28" width="46" height="46"><rect x="10" y="3" width="8" height="14" rx="4" fill="#fff"/><path d="M6 13a8 8 0 0016 0M14 21v4" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>',
};

const jsonLines = [
  '{',
  '  <span class="k">"actions"</span>: [',
  '    { <span class="k">"type"</span>: <span class="s">"circle"</span>,',
  '      <span class="k">"box"</span>: [<span class="n">412</span>, <span class="n">268</span>, <span class="n">148</span>, <span class="n">96</span>] },',
  '    { <span class="k">"type"</span>: <span class="s">"note"</span>,',
  '      <span class="k">"text"</span>: <span class="s">"What happens to</span>',
  '               <span class="s">the x in 2x?"</span> }',
  '  ]',
  '}',
];
const stnLab = ["You write", "Gemini reads the handwriting", "A real math engine checks each step", "The page writes back"];
const ghosts = ["f(x) = 3x² + 2x", "f'(x) = 6x + 2", "x² − 5x + 6 = 0", "(x − 2)(x − 3) = 0", "y = x² − 3", "2x + 7 = 15"];

stage.innerHTML = `
<section class="scene gridbg" id="s1">
  <div id="cards">${cards.map((c, i) => `<div class="acard" style="left:${cardPos[i][0]}px;top:${cardPos[i][1]}px"><small><i></i>${c[0]}</small>${c[1] ? `<b>${c[1]}</b>` : "<u></u><u style='width:82%'></u><u style='width:55%'></u>"}</div>`).join("")}</div>
  <div class="hd" id="h1" style="left:${ML}px;top:${tall ? 230 : 110}px;font-size:${tall ? 172 : 200}px">${hdHTML(tall ? ["Other", "AI tutors", "finish your", "homework."] : ["Other AI tutors", "finish your homework."])}</div>
  <svg class="fx" id="fx1"></svg>
</section>

<section class="scene" id="s2">
  <svg class="fx" id="fx2"></svg>
  <div class="hd" id="h2" style="left:${ML}px;top:${tall ? 640 : 360}px;font-size:${tall ? 300 : 250}px;font-weight:900">${hdHTML(tall ? ["This one", "won't."] : ["This one won't."])}</div>
</section>

<section class="scene" id="s3">
  <div id="floor"></div>
  <div class="hd cap" id="capA" style="left:${ML}px;top:${tall ? 190 : 400}px;font-size:${tall ? 108 : 92}px">${hdHTML(["Write math", "by hand."])}</div>
  <div class="hd cap" id="capB" style="left:${ML}px;top:${tall ? 190 : 400}px;font-size:${tall ? 108 : 92}px">${hdHTML(tall ? ["Pause. It reads", "your work."] : ["Pause.", "It reads", "your work."])}</div>
  <div id="cam"><div id="tab" style="width:${TW}px;height:${TH}px"><div id="screen">
    <div id="bar">
      <div class="tool on">${icon.pen}</div><div class="tool">${icon.era}</div><div class="tool">${icon.las}</div>
      <div id="doc">Problem set 4</div>
      <div id="chip"><i></i><span></span></div><div id="help">Help</div>
    </div>
    <div id="page" class="gridbg">
      <div id="scan"></div>
      <div class="hand st" id="l1" style="font-size:${HF}px"></div>
      <div class="hand st" id="l2" style="font-size:${HF}px"></div>
      <div class="hand tu" id="n1" style="font-size:70px"></div>
      <div class="hand tu" id="n2" style="font-size:70px"></div>

// ---------- player ----------
function fitStage() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  stage.style.transform = `scale(${s}) translate(-50%,-50%)`;
}
addEventListener("resize", fitStage); fitStage();

let t0 = 0, paused = Q.has("t"), cur = paused ? Math.max(0, parseFloat(Q.get("t")) || 0) : 0, ready = false;
function seek(t) { cur = clamp(t, 0, DURATION); if (ready) render(cur); }
function tick(now) {

}
function restart() { paused = false; t0 = performance.now(); }
stage.addEventListener("click", restart);
addEventListener("keydown", (e) => {
  if (e.key === "r" || e.key === "R") restart();
  else if (e.key === " ") { paused = !paused; t0 = performance.now() - cur * 1000; }
  else if (e.key === "ArrowRight" || e.key === "ArrowLeft") { paused = true; seek(cur + (e.key === "ArrowRight" ? 1 : -1) / FPS); }
});
// used by export.mjs
window.__film = { duration: DURATION, fps: FPS, width: W, height: H, seek: (t) => { paused = true; seek(t); } };

const fonts = ['800 100px Archivo', '900 100px Archivo', '500 100px Archivo', '700 100px Caveat', '400 100px Kalam', '500 30px "JetBrains Mono"', '700 30px "JetBrains Mono"'];

  layout(); buildCam(); ready = true; t0 = performance.now(); render(cur);
  window.__ready = true;
  requestAnimationFrame(tick);
